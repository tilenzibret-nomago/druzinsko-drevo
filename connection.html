<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Povezava med osebama — Družinsko drevo</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>Povezava med dvema osebama</h1>
    <div>
      <a href="index.html" class="header-link">← Pedigree pogled</a>
      <button id="logout-btn">Odjava</button>
    </div>
  </header>

  <main class="connection-main">
    <p class="hint">Izberi dve osebi — sistem poišče in nariše natančno pot (starše, stare starše ...), ki ju povezuje.</p>

    <div class="connection-picker">
      <div class="connection-field">
        <label>Prva oseba</label>
        <input type="text" id="search-a" placeholder="🔍 Išči ime ...">
        <div id="results-a" class="connection-results"></div>
        <div id="selected-a" class="connection-selected"></div>
      </div>
      <div class="connection-arrow">↔</div>
      <div class="connection-field">
        <label>Druga oseba</label>
        <input type="text" id="search-b" placeholder="🔍 Išči ime ...">
        <div id="results-b" class="connection-results"></div>
        <div id="selected-b" class="connection-selected"></div>
      </div>
    </div>

    <button id="find-btn" class="find-btn" disabled>Poišči povezavo</button>

    <div id="connection-result"></div>
  </main>

  <div id="edit-overlay" class="edit-overlay"></div>
  <aside id="edit-panel" class="edit-panel">
    <div class="edit-panel-header">
      <span>Urejanje osebe</span>
      <button id="close-panel-btn" class="close-panel-btn" aria-label="Zapri">×</button>
    </div>
    <iframe id="edit-panel-frame" class="edit-panel-frame" src="about:blank"></iframe>
  </aside>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/connection.js"></script>
  <script>
    (async () => {
      await requireAuth();
      await loadConnectionData();
    })();
    document.getElementById("logout-btn").addEventListener("click", signOut);

    document.getElementById("close-panel-btn").addEventListener("click", () => closeEditPanel());
    document.getElementById("edit-overlay").addEventListener("click", () => closeEditPanel());

    function closeEditPanel() {
      document.getElementById("edit-panel").classList.remove("open");
      document.getElementById("edit-overlay").classList.remove("open");
      document.getElementById("edit-panel-frame").src = "about:blank";
    }

    function openEditPanel(personId) {
      document.getElementById("edit-panel-frame").src = `person.html?id=${personId}&embed=1`;
      document.getElementById("edit-panel").classList.add("open");
      document.getElementById("edit-overlay").classList.add("open");
    }
  </script>
</body>
</html>
