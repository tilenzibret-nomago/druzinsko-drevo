<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topola demo - Družinsko drevo</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://pewu.github.io/topola/topola.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://pewu.github.io/topola/bundle.js"></script>
  <style>
    #topola-tree { background: #fff; border-radius: 12px; border: 1px solid #ece5da; min-height: 600px; overflow: auto; }
    .status-msg { color: #8a8074; padding: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Topola demo (resnični podatki)</h1>
    <a href="index.html" class="header-link">← Nazaj</a>
  </header>

  <main class="full-tree-main">
    <p class="status-msg" id="status">Nalagam podatke iz baze ...</p>
    <svg class="graph" id="topola-tree" width="100%" height="700"></svg>
  </main>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      await requireAuth();
      await loadTopolaDemo();
    })();

    function euDate(iso) {
      if (!iso) return "";
      const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
      const [y, m, d] = iso.split("-");
      return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
    }

    async function loadTopolaDemo() {
      const status = document.getElementById("status");
      const { data: people, error: e1 } = await supabaseClient.from("people").select("*");
      const { data: partnerships, error: e2 } = await supabaseClient.from("partnerships").select("*");
      const { data: parentChild, error: e3 } = await supabaseClient.from("parent_child").select("*");

      if (e1 || e2 || e3) {
        status.textContent = "Napaka pri nalaganju podatkov.";
        return;
      }

      const indiId = {};
      people.forEach((p, i) => { indiId[p.id] = `I${i + 1}`; });

      const famKey = (a, b) => [a, b].sort().join("|");
      const famMap = {};

      partnerships.forEach(pt => {
        const p1 = people.find(p => p.id === pt.person1_id);
        const p2 = people.find(p => p.id === pt.person2_id);
        if (!p1 || !p2) return;
        const husb = p1.gender === "M" ? p1 : (p2.gender === "M" ? p2 : p1);
        const wife = husb === p1 ? p2 : p1;
        const key = famKey(pt.person1_id, pt.person2_id);
        famMap[key] = famMap[key] || { husb: husb.id, wife: wife.id, children: [] };
      });

      const parentsOfChild = {};
      parentChild.forEach(pc => {
        (parentsOfChild[pc.child_id] ??= []).push(pc.parent_id);
      });
      Object.entries(parentsOfChild).forEach(([childId, parentIds]) => {
        if (parentIds.length === 2) {
          const key = famKey(parentIds[0], parentIds[1]);
          if (!famMap[key]) {
            const p1 = people.find(p => p.id === parentIds[0]);
            const p2 = people.find(p => p.id === parentIds[1]);
            const husb = p1?.gender === "M" ? p1 : p2;
            const wife = husb === p1 ? p2 : p1;
            famMap[key] = { husb: husb?.id, wife: wife?.id, children: [] };
          }
          famMap[key].children.push(childId);
        } else if (parentIds.length === 1) {
          // Topola se sesuje na družinah z enim samim staršem - za zdaj izpustimo
          // (izgubimo to povezavo v tem prototipu, a preprečimo napako)
        }
      });

      const famIds = {};
      let famCounter = 1;
      Object.keys(famMap).forEach(key => { famIds[key] = `F${famCounter++}`; });

      const famsOf = {}, famcOf = {};
      Object.entries(famMap).forEach(([key, fam]) => {
        const fid = famIds[key];
        if (fam.husb) (famsOf[fam.husb] ??= []).push(fid);
        if (fam.wife) (famsOf[fam.wife] ??= []).push(fid);
        fam.children.forEach(cid => { famcOf[cid] = fid; });
      });

      let ged = "0 HEAD\n1 GEDC\n2 VERS 5.5.1\n1 CHAR UTF-8\n";
      people.forEach(p => {
        const id = indiId[p.id];
        ged += `0 @${id}@ INDI\n`;
        ged += `1 NAME ${p.first_name || ""} /${p.last_name || p.maiden_name || ""}/\n`;
        ged += `1 SEX ${p.gender === "M" ? "M" : p.gender === "F" ? "F" : "U"}\n`;
        if (p.birth_date) ged += `1 BIRT\n2 DATE ${euDate(p.birth_date)}\n`;
        if (p.is_deceased) {
          ged += `1 DEAT Y\n`;
          if (p.death_date) ged += `2 DATE ${euDate(p.death_date)}\n`;
        }
        (famsOf[p.id] || []).forEach(fid => { ged += `1 FAMS @${fid}@\n`; });
        if (famcOf[p.id]) ged += `1 FAMC @${famcOf[p.id]}@\n`;
      });
      Object.entries(famMap).forEach(([key, fam]) => {
        const fid = famIds[key];
        ged += `0 @${fid}@ FAM\n`;
        if (fam.husb && indiId[fam.husb]) ged += `1 HUSB @${indiId[fam.husb]}@\n`;
        if (fam.wife && indiId[fam.wife]) ged += `1 WIFE @${indiId[fam.wife]}@\n`;
        fam.children.forEach(cid => {
          if (indiId[cid]) ged += `1 CHIL @${indiId[cid]}@\n`;
        });
      });
      ged += "0 TRLR\n";

      status.textContent = `Izrisujem ${people.length} oseb prek Topola knjižnice ...`;

      try {
        const json = topola.gedcomToJson(ged);
        const tilen = people.find(p => p.first_name === "Tilen") || people[0];
        const startId = indiId[tilen.id];

        topola.createChart({
          json,
          svgSelector: "#topola-tree",
          chartType: topola.KinshipChart,
          renderer: topola.DetailedRenderer,
          colors: topola.ChartColors.COLOR_BY_SEX,
        }).render({ startIndi: startId });

        status.textContent = `Prikazanih ${people.length} oseb. Izhodišče: ${tilen.first_name} ${tilen.last_name || ""}.`;
      } catch (err) {
        status.textContent = "Napaka pri izrisu: " + err.message;
        console.error(err);
      }
    }
  </script>
</body>
</html>
