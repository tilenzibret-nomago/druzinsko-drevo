<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celotno drevo — Družinsko drevo</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <header>
    <h1>Celotno drevo</h1>
    <div>
      <a href="index.html" class="header-link">← Pedigree pogled</a>
      <a href="network.html" class="header-link">📋 Seznam</a>
      <button id="logout-btn">Odjava</button>
    </div>
  </header>

  <main class="full-tree-main">
    <div class="wt-toolbar">
      <span class="hint">Povleci za premikanje, koleščkom miške zumiraj, klik na osebo odpre urejanje.</span>
      <div class="wt-zoom-controls">
        <button onclick="wtZoomOut()">−</button>
        <button onclick="wtZoomReset()">⟲</button>
        <button onclick="wtZoomIn()">+</button>
      </div>
    </div>
    <div id="WholeTree"></div>
  </main>

  <div id="edit-overlay" class="edit-overlay"></div>
  <aside id="edit-panel" class="edit-panel">
    <div class="edit-panel-header">
      <span>Urejanje osebe</span>
      <button id="close-panel-btn" class="close-panel-btn" aria-label="Zapri">×</button>
    </div>
    <iframe id="edit-panel-frame" class="edit-panel-frame" src="about:blank"></iframe>
  </aside>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/whole-tree.js"></script>
  <script>
    (async () => {
      await requireAuth();
      await loadWholeTree();
    })();

    document.getElementById("logout-btn").addEventListener("click", signOut);
    document.getElementById("close-panel-btn").addEventListener("click", () => closeEditPanel());
    document.getElementById("edit-overlay").addEventListener("click", () => closeEditPanel());

    function closeEditPanel() {
      document.getElementById("edit-panel").classList.remove("open");
      document.getElementById("edit-overlay").classList.remove("open");
      document.getElementById("edit-panel-frame").src = "about:blank";
      loadWholeTree();
    }

    window.addEventListener("message", (e) => {
      if (e.data === "person-saved" || e.data === "person-deleted") loadWholeTree();
    });

    function openEditPanel(personId) {
      document.getElementById("edit-panel-frame").src = `person.html?id=${personId}&embed=1`;
      document.getElementById("edit-panel").classList.add("open");
      document.getElementById("edit-overlay").classList.add("open");
    }
  </script>
</body>
</html>
