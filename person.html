<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oseba — Družinsko drevo</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>Podatki o osebi</h1>
    <a href="index.html">&larr; Nazaj na drevo</a>
  </header>

  <main>
    <form id="person-form">
      <label>Ime *
        <input type="text" id="first_name" required>
      </label>
      <label>Priimek
        <input type="text" id="last_name">
      </label>
      <label>Dekliški priimek
        <input type="text" id="maiden_name">
      </label>
      <label>Spol
        <select id="gender">
          <option value="M">Moški</option>
          <option value="F">Ženski</option>
          <option value="O">Drugo</option>
        </select>
      </label>
      <label>Datum rojstva
        <input type="date" id="birth_date">
      </label>
      <label>Kraj rojstva
        <input type="text" id="birth_place">
      </label>
      <label>
        <input type="checkbox" id="is_deceased"> Pokojni/-a
      </label>
      <label>Datum smrti
        <input type="date" id="death_date">
      </label>
      <label>Biografija
        <textarea id="bio" rows="4"></textarea>
      </label>

      <button type="submit">Shrani</button>
      <button type="button" id="delete-btn" style="display:none;">Izbriši osebo</button>
    </form>

    <section id="relations-section">
      <h2>Povezave</h2>
      <p class="hint">Dodajanje staršev, partnerjev in otrok bo na voljo v naslednjem koraku.</p>
    </section>
  </main>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/person-form.js"></script>
</body>
</html>
