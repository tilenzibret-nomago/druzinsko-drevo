<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <title>Topola - test prave veje</title>
  <link rel="stylesheet" href="https://pewu.github.io/topola/topola.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://pewu.github.io/topola/bundle.js"></script>
</head>
<body>
  <h1 id="status">Testiranje ...</h1>
  <svg class="graph" id="tree" width="1000" height="600"></svg>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function euDate(iso) {
      if (!iso) return "";
      const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
      const [y, m, d] = iso.split("-");
      return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
    }

    (async () => {
      await requireAuth();

      const ids = [
        "dbd30e34-9bc7-437a-9f9a-d8097df27d9b",
        "52024b80-e8b5-4e44-99f5-42439e9cc64f",
        "402ddffd-bd8d-420b-bb61-3bc1e29bad49",
        "3547eae0-d0eb-464f-9eda-0ec83ee06938",
        "0f021dec-6be5-4b82-af54-011169ce6676",
        "79af60c9-de6c-409c-87ff-196b9c310267",
        "daaa6f2a-ca00-41bd-a8f2-d9b73eb420b4",
      ];

      const { data: people } = await supabaseClient.from("people").select("*").in("id", ids);
      const { data: partnerships } = await supabaseClient.from("partnerships").select("*");
      const { data: parentChild } = await supabaseClient.from("parent_child").select("*");

      const idSet = new Set(ids);
      const subPartnerships = partnerships.filter(pt => idSet.has(pt.person1_id) && idSet.has(pt.person2_id));
      const subParentChild = parentChild.filter(pc => idSet.has(pc.parent_id) && idSet.has(pc.child_id));

      const indiId = {};
      people.forEach((p, i) => { indiId[p.id] = `I${i + 1}`; });
      const famKey = (a, b) => [a, b].sort().join("|");
      const famMap = {};

      subPartnerships.forEach(pt => {
        const p1 = people.find(p => p.id === pt.person1_id);
        const p2 = people.find(p => p.id === pt.person2_id);
        if (!p1 || !p2) return;
        const husb = p1.gender === "M" ? p1 : (p2.gender === "M" ? p2 : p1);
        const wife = husb === p1 ? p2 : p1;
        const key = famKey(pt.person1_id, pt.person2_id);
        famMap[key] = famMap[key] || { husb: husb.id, wife: wife.id, children: [] };
      });

      const parentsOfChild = {};
      subParentChild.forEach(pc => { (parentsOfChild[pc.child_id] ??= []).push(pc.parent_id); });
      Object.entries(parentsOfChild).forEach(([childId, parentIds]) => {
        if (parentIds.length === 2) {
          const key = famKey(parentIds[0], parentIds[1]);
          if (!famMap[key]) {
            const p1 = people.find(p => p.id === parentIds[0]);
            const p2 = people.find(p => p.id === parentIds[1]);
            const husb = p1?.gender === "M" ? p1 : p2;
            const wife = husb === p1 ? p2 : p1;
            famMap[key] = { husb: husb?.id, wife: wife?.id, children: [] };
          }
          famMap[key].children.push(childId);
        } else if (parentIds.length === 1) {
          const key = "single_" + parentIds[0];
          const parent = people.find(p => p.id === parentIds[0]);
          famMap[key] = famMap[key] || (parent?.gender === "F"
            ? { husb: null, wife: parentIds[0], children: [] }
            : { husb: parentIds[0], wife: null, children: [] });
          famMap[key].children.push(childId);
        }
      });

      const famIds = {};
      let famCounter = 1;
      Object.keys(famMap).forEach(key => { famIds[key] = `F${famCounter++}`; });
      const famsOf = {}, famcOf = {};
      Object.entries(famMap).forEach(([key, fam]) => {
        const fid = famIds[key];
        if (fam.husb) (famsOf[fam.husb] ??= []).push(fid);
        if (fam.wife) (famsOf[fam.wife] ??= []).push(fid);
        fam.children.forEach(cid => { famcOf[cid] = fid; });
      });

      let ged = "0 HEAD\n1 GEDC\n2 VERS 5.5.1\n1 CHAR UTF-8\n";
      people.forEach(p => {
        const id = indiId[p.id];
        ged += `0 @${id}@ INDI\n`;
        ged += `1 NAME ${p.first_name || ""} /${p.last_name || p.maiden_name || ""}/\n`;
        ged += `1 SEX ${p.gender === "M" ? "M" : p.gender === "F" ? "F" : "U"}\n`;
        if (p.birth_date) ged += `1 BIRT\n2 DATE ${euDate(p.birth_date)}\n`;
        if (p.is_deceased) {
          ged += `1 DEAT Y\n`;
          if (p.death_date) ged += `2 DATE ${euDate(p.death_date)}\n`;
        }
        (famsOf[p.id] || []).forEach(fid => { ged += `1 FAMS @${fid}@\n`; });
        if (famcOf[p.id]) ged += `1 FAMC @${famcOf[p.id]}@\n`;
      });
      Object.entries(famMap).forEach(([key, fam]) => {
        const fid = famIds[key];
        ged += `0 @${fid}@ FAM\n`;
        if (fam.husb && indiId[fam.husb]) ged += `1 HUSB @${indiId[fam.husb]}@\n`;
        if (fam.wife && indiId[fam.wife]) ged += `1 WIFE @${indiId[fam.wife]}@\n`;
        fam.children.forEach(cid => {
          if (indiId[cid]) ged += `1 CHIL @${indiId[cid]}@\n`;
        });
      });
      ged += "0 TRLR\n";

      console.log(ged);

      const status = document.getElementById("status");
      try {
        const json = topola.gedcomToJson(ged);
        topola.createChart({
          json,
          svgSelector: "#tree",
          chartType: topola.KinshipChart,
          renderer: topola.DetailedRenderer,
          colors: topola.ChartColors.COLOR_BY_SEX,
        }).render({ startIndi: indiId["dbd30e34-9bc7-437a-9f9a-d8097df27d9b"] });
        status.textContent = "Uspeh s pravo vejo (" + people.length + " oseb)!";
      } catch (err) {
        status.textContent = "Napaka: " + err.message;
        console.error(err);
      }
    })();
  </script>
</body>
</html>
