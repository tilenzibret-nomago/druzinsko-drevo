<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Družinsko drevo</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/family-chart/dist/styles/family-chart.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/family-chart/dist/family-chart.js"></script>
</head>
<body>
  <header>
    <h1>Družinsko drevo</h1>
    <div>
      <a href="connection.html" class="header-link">🔗 Poišči povezavo</a>
      <a href="network.html" class="header-link">📋 Seznam vseh</a>
      <button id="add-person-btn">+ Dodaj osebo</button>
      <button id="logout-btn">Odjava</button>
    </div>
  </header>

  <div id="selected-bar" class="selected-bar" style="display:none;">
    <div class="selected-info">
      <span class="selected-label">Izbrana oseba</span>
      <strong id="selected-person-name"></strong>
    </div>
    <button id="edit-selected-btn" class="edit-btn">Uredi / dodaj sorodnike</button>
  </div>

  <main>
    <div id="FamilyChart" class="f3"></div>
  </main>

  <div id="edit-overlay" class="edit-overlay"></div>
  <aside id="edit-panel" class="edit-panel">
    <div class="edit-panel-header">
      <span>Urejanje osebe</span>
      <button id="close-panel-btn" class="close-panel-btn" aria-label="Zapri">×</button>
    </div>
    <iframe id="edit-panel-frame" class="edit-panel-frame" src="about:blank"></iframe>
  </aside>

  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/tree.js"></script>
  <script>
    (async () => {
      await requireAuth();
      await loadAndRenderTree();
    })();

    document.getElementById("logout-btn").addEventListener("click", signOut);
    document.getElementById("add-person-btn").addEventListener("click", () => {
      openEditPanel(null);
    });

    document.getElementById("edit-selected-btn").addEventListener("click", () => {
      if (window.currentSelectedPersonId) openEditPanel(window.currentSelectedPersonId);
    });

    function openEditPanel(personId) {
      const frame = document.getElementById("edit-panel-frame");
      frame.src = personId ? `person.html?id=${personId}&embed=1` : `person.html?embed=1`;
      document.getElementById("edit-panel").classList.add("open");
      document.getElementById("edit-overlay").classList.add("open");
    }

    function closeEditPanel(shouldRefresh) {
      document.getElementById("edit-panel").classList.remove("open");
      document.getElementById("edit-overlay").classList.remove("open");
      document.getElementById("edit-panel-frame").src = "about:blank";
      if (shouldRefresh) loadAndRenderTree();
    }

    document.getElementById("close-panel-btn").addEventListener("click", () => closeEditPanel(true));
    document.getElementById("edit-overlay").addEventListener("click", () => closeEditPanel(true));

    // Sporočilo iz iframe-a (person.html), ko je oseba shranjena/izbrisana
    window.addEventListener("message", (e) => {
      if (e.data === "person-saved" || e.data === "person-deleted") {
        loadAndRenderTree();
      }
    });
  </script>
</body>
</html>
